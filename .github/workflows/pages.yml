name: Publish token viewer

on:
  push:
    branches: [develop]
    paths:
      - results/**
      - metric/build_viewer.py
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out develop
        uses: actions/checkout@v6
      - name: Discover all measured dates and tasks
        run: python3 metric/build_viewer.py
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload results and shared viewer
        uses: actions/upload-pages-artifact@v4
        with:
          path: results
      - name: Publish viewer
        id: deployment
        uses: actions/deploy-pages@v4
