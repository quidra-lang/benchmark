; staging mirrors production
@include prod

[app]
name = shop-staging
environment = staging
release_date = 2031-01-15
motd = staging costs $0

[server]
port = 8443
read_timeout = 2m
write_timeout = 90s
max_body = 65536

[server.tls]
enabled = on
cert = /etc/ssl/staging/../shop.crt
@unset key

[cache]
size = 256mb

[features]
rollout = -5
beta_until = 2026-04-31

[database]
url = postgres://staging-db:5432/shop
pool_min = 50
pool_max = 40

[upstream.search : upstream.catalog]
host = search.staging.internal
weight = 0

[upstream.search_backup : upstream.search]
host = backup.staging.internal
weight = 5
port = 9200

[upstream.mirror : upstream.nonexistent]
host = mirror.staging.internal
