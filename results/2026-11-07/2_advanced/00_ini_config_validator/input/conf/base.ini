; base configuration shared by every profile
# both ';' and '#' start a comment

@include logging
@include limits

[app]
name = shop
version = "2.4.1"
debug = no
admins = alice, bob, carol
motd = "Welcome to the \"shop\" service ; #1 in town"

[server]
host = 0.0.0.0
port = 8080
workers = 4
max_body = 2MB
read_timeout = 30s
write_timeout = 1m
allowed_origins = https://shop.example.com, \
                  https://admin.example.com:443/

[.tls]
enabled = false
min_version = TLS1.2

[database]
url = postgres://db.internal:5432/shop
user = shop
pool_min = 2
pool_max = 20
timeout = 5s

[cache]
backend = memory
size = 128MB
ttl = 15m

@include upstreams
