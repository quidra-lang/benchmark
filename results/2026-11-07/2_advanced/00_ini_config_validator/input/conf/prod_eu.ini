region = eu
@include prod

[app]
environment = production
admins += erik, alice
release_date = 2026-13-01

[server]
host = eu.shop.example.com
@unset bind
@unset debug_port
public_url = https://${server.host}/

[database]
url = postgres://db-eu.internal:5432/shop
@unset replicas
pool_min = 0
password = "eu-Pa55word!"
user = shop_eu_readwrite_user

[limits]
rate = +250
max_upload = 3GB

[features]
enabled += wishlist, search
rollout = 25
beta_until = 2027-03-31

[secrets]
pin = 99999
api_token = "eu-token-0123456789abcdef"
webhook = https://hooks.example.com/notify?eu=1

[upstream.catalog]
@unset tags
tags += eu

[upstream.west:upstream.east]
[upstream.east : upstream.west]
host = east.internal
