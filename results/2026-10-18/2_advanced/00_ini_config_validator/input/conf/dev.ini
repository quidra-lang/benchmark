; developer workstation
@include base
@include local_overrides

[app]
environment = Development
debug_mode = yes
release_date = 2024-02-29
admins += dave
motd = "line one\nline two\ttabbed \\ backslash \
        continued"

[server]
hostname = LocalHost
port = 8000
workers = 0x0A
public_url = http://${server.host}:${port}/api/../v1/
max_body = 1.5MB

[database]
url = postgres://localhost:5432/shop_dev
user = dev
password = "dev\$ecret-pass"
replicas =

[limits]
max_upload = 65536B

[cache]
servers = localhost, 127.0.0.1, , localhost
ttl = 1h30m

[log]
dir = ./logs/../var//log/.
keep = 03
level = debug
level = warn

[features]
enabled = search, Chat, reviews
ab_split = 50, 50
beta_until = ${missing.key}
