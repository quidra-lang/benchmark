; production
@include base
@include secrets
@include features
@include upstreams

[app]
environment = PRODUCTION
release_date = 2026-11-02
verbose = off

[server]
port = 443
bind = 10.0.0.12
workers = 32
max_body = 8MB
public_url = HTTPS://Shop.Example.COM:443/./index/
allowed_origins += https://shop.example.com/, \
    https://m.example.com

[.tls]
enabled = true
cert = /etc/ssl/shop.crt
key = /etc/ssl/private/../private/shop.key
min_version = tls1.3

[database]
url = postgres://db-primary.internal:5432/shop
replicas = db-r1.internal, db-r2.internal, db-r1.internal
pool_max = 64

[cache]
backend = redis
servers = 10.0.1.10, 10.0.1.11, 10.0.1.256
size = 4GB
ttl = 25h

[log]
level = warn
rotate_size = 0.5GB

[limits]
burst = 1_500
