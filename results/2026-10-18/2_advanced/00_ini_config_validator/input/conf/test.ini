; continuous integration
@include base
@include ci
@include broken

[app]
environment = test
release_date = 2023-02-29
debug = maybe
motd = back\slash

[server]
listen_port = 7070
workers = 65
max_body = 1.3KB
read_timeout = 30s1m
public_url = ${server.self}
allowed_origins = ftp://files.example.com, http://bad host/
bind = 010.0.0.1

[server]
self = "${server.self}"

[database]
url = "postgres://ci-db:5432/test"
user = ci
pool_min = 5
pool_max = abc
replicas =
replicas+=db-ci.internal

[cache]
backend = Redis
servers = cache-1.ci, -bad-.ci
size = 512KB

[server.tls]
min_version = tls1.1
enabled = 0

[features]
ab_split = 100
enabled = search, voice

[limits]
burst = 0xZZ
max_upload = 2TB
rate = 1234567890123

[metrics]
endpoint = ${alpha}
alpha = ${beta}
beta = ${alpha}
gamma = ${alpha}-suffix
delta = ${not valid}
price = "costs \$5 or ${metrics.epsilon}"
epsilon = $${undefined
