<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Quidra Benchmark</title>
  <link rel="stylesheet" href="viewer.css">
  <script src="viewer.js" defer></script>
</head>
<body>
  <header>
    <h1>Quidra Benchmark</h1>
    <nav id="controls" aria-label="Select token view">
      <label>Date<select id="date" disabled></select></label>
      <label>Difficulty<select id="difficulty" disabled></select></label>
      <label>Topic<select id="topic" disabled></select></label>
      <label>Language<select id="language" disabled></select></label>
      <label>Task<select id="task" disabled></select></label>
    </nav>
    <p id="summary" role="status" hidden></p>
  </header>
  <p id="message" role="status">Loading…</p>
  <noscript>Enable JavaScript to display token-colored code.</noscript>
  <main id="programs" aria-label="Token-colored source"></main>
</body>
</html>
